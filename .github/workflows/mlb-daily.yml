name: mlb-daily

# Refresh the current season's schedule, fill in yesterday's results, run the
# rundown against the latest logged prices, rebuild the site, then prove it
# with ops/healthcheck.py. Three slots because GitHub's schedule is
# best-effort (the single 11:00 slot silently did not fire on 2026-09-11);
# every run is idempotent (the log and paper trade keep the last row per
# game), and the later slots see posted probables and fresher prices.
on:
  schedule:
    - cron: "0 15 * * *"         # 11:00 ET (EDT)
    - cron: "30 16 * * *"        # 12:30 ET
    - cron: "0 20 * * *"         # 16:00 ET, before the early first pitches
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-hq-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --no-dev --extra torch   # NFL site fits the deep ensemble
      - name: refresh current season schedule and games.csv
        run: |
          uv run python ops/backfill_mlb.py --schedule --seasons 2026 --force
          uv run python ops/compile_mlb.py --games-only
      - name: fill results into the narrative log
        run: uv run python ops/settle_log.py
      - name: market backtests (grow with the log)
        continue-on-error: true
        run: |
          uv run python ops/backtest_mlb_market.py        > data/mlb/market_backtest_ml.txt     2>&1 || true
          uv run python ops/backtest_mlb_totals_market.py > data/mlb/market_backtest_totals.txt 2>&1 || true
      - name: paper-trade P&L
        # Must run before the site build below: it was running after, so the
        # site's Live Bet Performance section always showed yesterday's
        # total, one full cycle behind whatever the cron had just settled.
        continue-on-error: true
        run: uv run python ops/paper_trade.py --stake 15 --min-edge 0.04
      - name: rundown
        run: uv run python -m src.mlb.rundown --days 1 --db data/kalshi_prices.db
      - name: health gate (data)
        # Verifies the schedule was refreshed, yesterday settled, every
        # upcoming game got a row with a probability, a total, a temperature
        # and a price. Failures are recorded in health.json (the site shows
        # them) and fail the job at the end, after the commit, so a bad run
        # is visible rather than invisible.
        id: health_data
        continue-on-error: true
        run: uv run python ops/healthcheck.py --stage data
      - name: commit data
        # docs/index.html is deliberately NOT part of this commit. It is a
        # single generated file that both mlb-daily and nfl-daily rebuild in
        # full and commit; on 2026-09-14 that produced a real rebase conflict
        # (two different regenerated copies of the same lines), not a race --
        # the shared concurrency group already serializes these workflows,
        # but sequential commits to the same generated file still conflict
        # textually. Data files never overlap between the two workflows, so
        # they commit and rebase here; the site is rebuilt fresh against
        # whatever just landed and committed on its own, below.
        run: |
          git config user.name "model-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mlb/raw/schedule/2026.json.gz data/mlb/games.csv data/mlb/narrative/log.csv data/mlb/paper_trades.csv data/mlb/market_backtest_ml.txt data/mlb/market_backtest_totals.txt data/mlb/health.json
          git diff --cached --quiet && exit 0
          git commit -m "data(mlb): daily rundown $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not land the mlb data commit after 3 attempts" && exit 1
      - name: site
        # Rebuilt against the just-pulled state, so it reflects the latest
        # data commit from either workflow, not a snapshot from before it.
        run: uv run python -m src.site.build --db data/kalshi_prices.db
      - name: health gate (site)
        id: health_site
        continue-on-error: true
        run: uv run python ops/healthcheck.py --stage site
      - name: commit site
        run: |
          git config user.name "model-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          # health.json too: the site-stage check (previous step) appends to
          # the same file "commit data" already pushed with only the
          # data-stage checks, leaving it dirty here. Reproduced locally:
          # missing this was the second cause of the 2026-09-14 CI failures,
          # after the docs/index.html conflict this split was meant to fix.
          git add docs/index.html data/mlb/health.json
          git diff --cached --quiet && exit 0
          git commit -m "site(mlb): rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            # A conflict here is always in docs/index.html alone -- keep our
            # freshly-built copy rather than attempting a textual merge of a
            # generated file. Note git's rebase convention inverts the usual
            # meaning: "ours" is the upstream branch being replayed onto,
            # "theirs" is the commit being rebased, so -X theirs is correct
            # here (the opposite of what it would mean in a merge).
            if git pull --rebase -X theirs origin main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not land the mlb site commit after 3 attempts" && exit 1
      - name: fail if unhealthy
        if: steps.health_data.outcome == 'failure' || steps.health_site.outcome == 'failure'
        run: |
          jq -r '.hard_failures[]' data/mlb/health.json | sed 's/^/HARD FAIL: /'
          exit 1
