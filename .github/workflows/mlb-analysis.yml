name: mlb-analysis

# On-demand analyses: paper-trade P&L and one-off studies.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "ops script to run"
        default: "paper_trade"
        type: choice
        options: [paper_trade, study_doubleheader, test_factor]
      extra:
        description: "extra args"
        default: ""

permissions:
  contents: write

concurrency:
  group: model-hq-data
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --no-dev
      - run: uv run python ops/${{ inputs.script }}.py ${{ inputs.extra }}
      - name: commit
        run: |
          git config user.name "model-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mlb || true
          git diff --cached --quiet && exit 0
          git commit -m "data(mlb): ${{ inputs.script }} output"
          git pull --rebase origin main
          git push origin HEAD:main
