name: nfl-daily

# NFL parity with the MLB pipeline: live prices at read time, verdicts logged
# with the price they were computed against, paper-trade P&L, site rebuilt.
# Runs through the season; harmless in the offseason (no games in the horizon).
on:
  schedule:
    - cron: "9 16 * * *"        # 12:09 ET; off the hour, see mlb-daily.yml
    - cron: "9 19 * * *"        # 15:09 ET, second slot; GitHub's schedule is best-effort
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-hq-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --no-dev --extra torch
      - name: tests
        run: uv sync --extra dev --extra torch && uv run pytest -q
      - name: refresh games.csv from nflverse
        # This was missing entirely: the NFL side ran on games.csv frozen at
        # fork time with zero 2026 results in it, ever, on every game already
        # played. Same validation guard David's weekly-site.yml uses, so a
        # truncated or error-page response fails loudly instead of poisoning
        # the model silently.
        # Two hosts for the same file, then the committed copy. nflverse being
        # down is a warning on the page, not a day with no slate: the marker
        # file is read by ops/healthcheck_nfl.py.
        run: |
          set +e
          ok=0
          for url in \
            https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv \
            https://github.com/nflverse/nfldata/raw/master/data/games.csv ; do
            curl -sSfL --retry 2 --retry-delay 5 "$url" -o /tmp/games.new.csv || continue
            uv run python - <<'PY' && { ok=1; break; }
          import pandas as pd, sys
          need = {"game_id","season","game_type","week","gameday","home_team",
                  "away_team","result","home_qb_id","away_qb_id","home_rest",
                  "away_rest","div_game","roof","spread_line"}
          df = pd.read_csv("/tmp/games.new.csv", low_memory=False)
          missing = need - set(df.columns)
          if missing: sys.exit(f"games.csv is missing columns: {sorted(missing)}")
          if len(df) < 7000: sys.exit(f"games.csv looks truncated: {len(df)} rows")
          print(f"games.csv ok: {len(df)} rows through season {df.season.max()}")
          PY
          done
          if [ "$ok" = "1" ]; then
            mv /tmp/games.new.csv data/nfl/games.csv
            echo "nflverse $(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/nfl/.games_csv_source
          else
            echo "::warning::nflverse unreachable on every host; using the committed games.csv"
            echo "cache $(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/nfl/.games_csv_source
          fi
      - name: refresh EPA for the season in progress
        # team_game_stats.csv used to be built once and never again, so the EPA
        # half of the feature set would freeze while games.csv kept moving.
        # Not fatal: before week 1 nflverse has not published this file yet.
        continue-on-error: true
        run: uv run python src/nfl/prep_pbp.py --refresh-latest --games data/nfl/games.csv --cache data/nfl/team_game_stats.csv
      - name: rundown
        run: uv run python -m src.nfl.rundown --days 8
      - name: health gate (data)
        # 2026-09-13: a delayed cron ran mid-game and priced eight games
        # against a live, in-progress Kalshi market. Both pricing paths now
        # filter by kickoff time; this independently re-derives kickoff for
        # every priced row and fails if one slipped through anyway.
        id: health_data
        continue-on-error: true
        run: uv run python ops/healthcheck_nfl.py --stage data
      - name: settle and score
        continue-on-error: true
        run: uv run python ops/paper_trade.py --sport nfl --stake 15 --min-edge 0.04
      - name: commit data
        # docs/index.html is deliberately NOT part of this commit. It is a
        # single generated file that both mlb-daily and nfl-daily rebuild in
        # full and commit; on 2026-09-14 that produced a real rebase conflict
        # (two different regenerated copies of the same lines), not a race --
        # the shared concurrency group already serializes these workflows,
        # but sequential commits to the same generated file still conflict
        # textually. Data files never overlap between the two workflows, so
        # they commit and rebase here; the site is rebuilt fresh against
        # whatever just landed and committed on its own, below.
        run: |
          git config user.name "model-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nfl/games.csv data/nfl/team_game_stats.csv data/nfl/rundown_log.csv data/nfl/health.json || true
          git diff --cached --quiet && exit 0
          git commit -m "data(nfl): daily rundown $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            # These files are regenerated by this run; on a conflict with a
            # concurrent run of the same sport, this run's copy wins
            # (-X theirs: the commit being replayed). Always abort a failed
            # rebase before retrying -- the loop used to retry into an
            # "unmerged files" state and fail all three times.
            if git pull --rebase -X theirs origin main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not land the nfl data commit after 3 attempts" && exit 1
      - name: rebuild the site
        # Rebuilt against the just-pulled state, so it reflects the latest
        # data commit from either workflow, not a snapshot from before it.
        run: uv run python -m src.site.build
      - name: health gate (site)
        id: health_site
        continue-on-error: true
        run: uv run python ops/healthcheck_nfl.py --stage site
      - name: commit site
        run: |
          git config user.name "model-hq-bot"
          git config user.email "actions@users.noreply.github.com"
          # health.json too: the site-stage check (previous step) appends to
          # the same file "commit data" already pushed with only the
          # data-stage checks, leaving it dirty here. Reproduced locally:
          # missing this was the second cause of the 2026-09-14 CI failures,
          # after the docs/index.html conflict this split was meant to fix.
          git add docs/index.html data/nfl/health.json
          git diff --cached --quiet && exit 0
          git commit -m "site(nfl): rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            # A conflict here is always in docs/index.html alone -- keep our
            # freshly-built copy rather than attempting a textual merge of a
            # generated file. Note git's rebase convention inverts the usual
            # meaning: "ours" is the upstream branch being replayed onto,
            # "theirs" is the commit being rebased, so -X theirs is correct
            # here (the opposite of what it would mean in a merge).
            if git pull --rebase -X theirs origin main; then
              git push origin HEAD:main && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not land the nfl site commit after 3 attempts" && exit 1
      - name: fail if unhealthy
        if: steps.health_data.outcome == 'failure' || steps.health_site.outcome == 'failure'
        run: |
          jq -r '.hard_failures[]' data/nfl/health.json | sed 's/^/HARD FAIL: /'
          exit 1
