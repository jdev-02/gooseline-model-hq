# Narrative factor registry
#
# A "read" is a claim the model cannot see: a pitcher back from injury, a club
# chasing a playoff spot, a lineup resting. Written as prose, a read is a
# one-off and unfalsifiable. Written as a factor, it is a hypothesis with a
# direction, a magnitude, and a test.
#
# Every narrative entry names a factor. Each factor carries its status:
#
#   untested   - stated, never measured. Contributes a read, not a prior.
#   supported  - measured against history and it holds. Safe to size on.
#   rejected   - measured and it does not hold. Keep the id so the same read
#                cannot quietly reappear under a new name.
#
# A rejected factor is more valuable than an untested one: it stops a bet.
# Once a factor reaches `supported` with a stable effect it should graduate
# out of here and become a model feature, at which point the narrative layer
# stops carrying it.

factors:

  - id: starter_returning
    label: Starter returning from the injured list
    hypothesis: >-
      A starter in his first outing back is sharper than his season line
      suggests: extra rest, a strict pitch count, and a hitter pool with no
      recent film. The model sees only his stale FIP EWMA.
    direction: favors the returning pitcher's club
    typical_delta_runs: 0.3
    test: ops/test_factor.py --factor starter_returning --sweep
    status: rejected
    evidence: >-
      Layoff length matters and pooling it hides the structure. Mean residual
      in the claimed direction, 2023-2025, by gap band:
        6-9d    n=5361  +0.020 (t +0.33)   normal rest, no effect
        10-14d  n= 410  +0.004 (t +0.02)   no effect
        15-20d  n= 193  -0.027 (t -0.08)   no effect
        21-40d  n= 229  -0.682 (t -2.41)   SIGNIFICANT, and negative
        41d+    n= 721  -0.181 (t -1.08)   no effect
      The read as stated - a returning starter is sharper than his line -
      is not supported at any length. An earlier pooled 15+ test reported
      -0.209 (t -1.69); that was an artifact of the 21-40d band and is
      superseded by this sweep.
    seen: [2026-08-29 BOS@NYY G2 (Fried, 16-day gap, won). That gap sits in
      the 15-20d band where the measured effect is zero, so the win was
      neither predicted nor contradicted by this factor.]
    note: >-
      The 2026-08-29 read described Fried as making his first start back
      from a UCL strain. He was six starts past it: the strain cost him
      2026-05-13 to 2026-07-22, and this was a separate 16-day gap.

  - id: starter_short_il_return
    label: Starter returning from a 21-40 day absence
    hypothesis: >-
      A three-to-six week absence is long enough to be a real injury but
      short enough that the pitcher is rushed back before he is right. The
      model sees only a stale FIP and a rest-days count it clips at 7.
    direction: AGAINST the returning pitcher's club
    typical_delta_runs: -0.68
    test: ops/test_factor.py --factor starter_returning --sweep
    status: supported
    evidence: >-
      n=229 starts, 2023-2025. Mean residual -0.682 runs against the
      returning pitcher's club (se 0.283, t = -2.41). The effect disappears
      below 21 days and above 40, which is the shape a real mechanism would
      have rather than a fishing artifact.
    note: >-
      Supported on a single pre-specified sweep of five bands, so treat the
      magnitude as an upper bound until it survives 2026 out of sample. This
      belongs in features.py as a rest-band term, not in a human read.

  - id: pitcher_matchup_history
    label: Starter has a specific history against this opponent
    hypothesis: >-
      Beyond platoon splits, some starters own particular lineups. The model
      carries no pitcher-by-opponent term at all.
    direction: favors the pitcher's club
    typical_delta_runs: 0.25
    test: >-
      For each start, compute the pitcher's prior runs-allowed rate against
      that club versus everyone else, then check whether the gap predicts the
      next meeting. Expect heavy shrinkage; samples are tiny.
    status: untested
    seen: [2026-08-28 BOS@NYY (Schlittler, won)]

  - id: playoff_push
    label: Club chasing a playoff spot in September
    hypothesis: >-
      A contender in the final month plays its leverage arms harder and rests
      regulars less than its season-long profile implies.
    direction: favors the contending club
    typical_delta_runs: 0.2
    test: ops/test_factor.py --factor playoff_push
    status: rejected
    evidence: >-
      370 September games, 2023-2025, where both clubs were above .500 going
      in. Mean residual +0.163 runs toward the AWAY club (se 0.228, t =
      -0.72 on the home side): no measurable bias in either direction. Clubs
      in a seeding race do not beat the model's expectation, which is the
      sensible result - both clubs are trying, and the market already knows
      the standings.
    seen: [2026-08-27 HOU@NYY (lost), 2026-08-30 BOS@NYY (head-to-head
      tiebreaker read, not bet on this factor)]

  - id: doubleheader_bounceback
    label: Club shut out or blown out in game 1 rebounds in game 2
    hypothesis: >-
      A club embarrassed in the opener responds in the nightcap.
    direction: favors the club that lost game 1
    typical_delta_runs: 0.0
    test: ops/study_doubleheader.py
    status: rejected
    evidence: >-
      622 doubleheader pairs, 2008-2026. Both shutout buckets sit about 5
      points BELOW baseline in game 2, and a real causal effect cannot point
      the same way from opposite causes. Game 1 and game 2 totals correlate
      at r = +0.087, which is nil and the wrong sign for a bounce-back.
    seen: [2026-08-29 BOS@NYY (considered, not bet)]

  - id: scoring_regression
    label: Last game was low or high scoring, so expect the reverse
    hypothesis: >-
      Run totals revert game to game.
    direction: none
    typical_delta_runs: 0.0
    test: ops/study_doubleheader.py plus the game-to-game total correlation
    status: rejected
    evidence: >-
      Consecutive-game totals are effectively independent (r = +0.087 within
      doubleheaders, where the clubs and park are held constant, which is the
      most favorable possible test). Teams are not due.
    seen: [2026-08-29 BOS@NYY G1 over 7.5 (lost)]

  - id: day_night_split
    label: Starter has a strong day/night split
    hypothesis: >-
      Some starters are genuinely better in daylight or under lights, and the
      model carries no day/night term for the pitcher at all - only a single
      game-level day_night flag.
    direction: favors the club whose starter is in his better condition
    typical_delta_runs: 0.0
    test: ops/test_factor.py --factor day_night_split
    status: rejected
    evidence: >-
      728 starts, 2023-2025, where a pitcher had at least five prior starts
      in each condition and his FIP-peripheral rate was at least 1.0 better
      in tonight's. Mean residual +0.047 runs in the claimed direction (se
      0.164, t = +0.28): nothing. Built on peripherals rather than ERA
      precisely because ERA splits are dominated by balls-in-play luck.
    seen: >-
      2026-08-30 BOS@NYY. Will Warren carried a 2.26 day ERA against 6.06 at
      night, a 3.80-run gap. His peripherals told a much smaller story: K/9
      was actually HIGHER at night (9.21 vs 8.57), and the FIP gap was about
      1.1 runs rather than 3.8. A split that does not move strikeouts is
      sequencing luck wearing a pattern.

  - id: bullpen_burned
    label: Opponent's bullpen was heavily used in the last 48 hours
    hypothesis: >-
      A club that emptied its pen yesterday fields worse relief today.
    direction: favors the rested club
    typical_delta_runs: 0.2
    test: >-
      The model already carries bp_workload_diff (relief innings over three
      days). Test whether a human read adds anything beyond that feature.
    status: untested
    note: partially covered by an existing model feature; overlap must be
      measured before this is ever sized on.

  - id: spot_starter
    label: Opponent is starting a call-up, opener, or bullpen game
    hypothesis: >-
      When no probable is listed, the model substitutes a league-average
      starter, which flatters a club that is actually piecing the game
      together. The real arm is usually worse than average.
    direction: against the club with the unlisted or spot starter
    typical_delta_runs: 0.35
    test: >-
      Find games where the probable was absent 12 hours out. Compare the
      model's league-mean fallback against what the actual starter did.
    status: untested
    note: >-
      This one is a model deficiency, not a genuine edge. If it tests as
      supported the fix belongs in features.py, not in a human read.
